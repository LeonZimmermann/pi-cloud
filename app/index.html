<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pi Cloud</title>
  <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111317" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Pi Cloud">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-cloud" viewBox="0 0 24 24"><path d="M7 18.5a4.5 4.5 0 0 1-.6-8.96A6 6 0 0 1 18 8.6a4.25 4.25 0 0 1-.25 8.9z" fill="currentColor"/></symbol>
      <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 6.5A2.5 2.5 0 0 1 5.5 4h3.6c.6 0 1.2.24 1.6.66L12 6h6.5A2.5 2.5 0 0 1 21 8.5v9a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5z" fill="currentColor"/></symbol>
      <symbol id="i-file" viewBox="0 0 24 24"><path d="M6.5 2.75h7l5 5v12a1.5 1.5 0 0 1-1.5 1.5h-10.5a1.5 1.5 0 0 1-1.5-1.5v-15.5a1.5 1.5 0 0 1 1.5-1.5z" fill="currentColor" opacity=".18"/><path d="M13.5 2.75v3.5a1.5 1.5 0 0 0 1.5 1.5h3.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M6.5 2.75h7l5 5v12a1.5 1.5 0 0 1-1.5 1.5h-10.5a1.5 1.5 0 0 1-1.5-1.5v-15.5a1.5 1.5 0 0 1 1.5-1.5z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></symbol>
      <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="8.5" cy="9.5" r="1.8" fill="currentColor"/><path d="M4 18l5.2-5.2a1.2 1.2 0 0 1 1.7 0L14 16l2.2-2.2a1.2 1.2 0 0 1 1.7 0L21 17" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
      <symbol id="i-pdf" viewBox="0 0 24 24"><use href="#i-file"/><text x="12" y="17.6" text-anchor="middle" font-size="5.6" font-weight="700" font-family="system-ui,sans-serif" fill="currentColor">PDF</text></symbol>
      <symbol id="i-video" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10 9.2v5.6a.5.5 0 0 0 .76.43l4.6-2.8a.5.5 0 0 0 0-.86l-4.6-2.8a.5.5 0 0 0-.76.43z" fill="currentColor"/></symbol>
      <symbol id="i-audio" viewBox="0 0 24 24"><path d="M9 18V6.5l10-2.5V16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="6.8" cy="18" r="2.4" fill="currentColor"/><circle cx="16.8" cy="16" r="2.4" fill="currentColor"/></symbol>
      <symbol id="i-text" viewBox="0 0 24 24"><use href="#i-file"/><path d="M8 12.5h8M8 15.5h8M8 18.5h5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></symbol>
      <symbol id="i-archive" viewBox="0 0 24 24"><use href="#i-file"/><path d="M11 5h1.5M11 7.5h1.5M11 10h1.5M11 12.5h1.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><rect x="10.3" y="14" width="2.9" height="3.6" rx=".8" fill="none" stroke="currentColor" stroke-width="1.3"/></symbol>
      <symbol id="i-sheet" viewBox="0 0 24 24"><use href="#i-file"/><path d="M7.5 12h9M7.5 15.2h9M7.5 18.4h9M11 10.5v9" stroke="currentColor" stroke-width="1.3"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
      <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 15.5V4.5M7.5 9 12 4.5 16.5 9M5 15v2.5A2.5 2.5 0 0 0 7.5 20h9a2.5 2.5 0 0 0 2.5-2.5V15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4.5v11M7.5 11l4.5 4.5 4.5-4.5M5 19.5h14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-folder-plus" viewBox="0 0 24 24"><path d="M3 6.5A2.5 2.5 0 0 1 5.5 4h3.6c.6 0 1.2.24 1.6.66L12 6h6.5A2.5 2.5 0 0 1 21 8.5v9a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5z" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 10v6M9 13h6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
      <symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.6"/><rect x="13" y="4" width="7" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.6"/><rect x="4" y="13" width="7" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.6"/><rect x="13" y="13" width="7" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol>
      <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6.5h11M9 12h11M9 17.5h11" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><circle cx="5" cy="6.5" r="1.2" fill="currentColor"/><circle cx="5" cy="12" r="1.2" fill="currentColor"/><circle cx="5" cy="17.5" r="1.2" fill="currentColor"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m15 15 5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
      <symbol id="i-more" viewBox="0 0 24 24"><circle cx="6" cy="12" r="1.7" fill="currentColor"/><circle cx="12" cy="12" r="1.7" fill="currentColor"/><circle cx="18" cy="12" r="1.7" fill="currentColor"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4.5 7h15M9.5 7V5.2c0-.66.54-1.2 1.2-1.2h2.6c.66 0 1.2.54 1.2 1.2V7M6.5 7l.8 11.6A1.5 1.5 0 0 0 8.8 20h6.4a1.5 1.5 0 0 0 1.5-1.4L17.5 7M10 11v5.5M14 11v5.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-edit" viewBox="0 0 24 24"><path d="M14.8 5.2l4 4L9 19H5v-4z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M13 7l4 4" stroke="currentColor" stroke-width="1.6"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></symbol>
      <symbol id="i-left" viewBox="0 0 24 24"><path d="M14.5 5.5 8 12l6.5 6.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-right" viewBox="0 0 24 24"><path d="M9.5 5.5 16 12l-6.5 6.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-select" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="4" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="m8 12 3 3 5-6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-sort" viewBox="0 0 24 24"><path d="M8 5v14M4.5 8.5 8 5l3.5 3.5M16 19V5M12.5 15.5 16 19l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-logout" viewBox="0 0 24 24"><path d="M14 4.5H7A2.5 2.5 0 0 0 4.5 7v10A2.5 2.5 0 0 0 7 19.5h7M10 12h10M16.5 8.5 20 12l-3.5 3.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M19 12a7 7 0 1 1-2.05-4.95M19 4.5V8h-3.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-zoom-in" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="m15 15 5 5M8 10.5h5M10.5 8v5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
      <symbol id="i-zoom-out" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="m15 15 5 5M8 10.5h5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
      <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 10.5 12 4l8 6.5V19a1.5 1.5 0 0 1-1.5 1.5H15v-6h-6v6H5.5A1.5 1.5 0 0 1 4 19z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></symbol>
      <symbol id="i-people" viewBox="0 0 24 24"><circle cx="9" cy="8.5" r="3.2" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M3 19.5c.6-3.3 3-5.2 6-5.2s5.4 1.9 6 5.2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><circle cx="16.8" cy="9.2" r="2.6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M17.5 14.3c2 .3 3.3 1.8 3.7 4.2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
      <symbol id="i-album" viewBox="0 0 24 24"><rect x="3.5" y="6.5" width="14" height="13" rx="2.2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M7 4h11.3A2.2 2.2 0 0 1 20.5 6.2V16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M5 17.5l3.8-3.8a1 1 0 0 1 1.4 0l2.3 2.3 1.4-1.4a1 1 0 0 1 1.4 0l1.2 1.2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></symbol>
      <symbol id="i-album-add" viewBox="0 0 24 24"><use href="#i-album"/><path d="M8.5 10.5h4M10.5 8.5v4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
      <symbol id="i-album-remove" viewBox="0 0 24 24"><use href="#i-album"/><path d="M8.5 10.5h4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
      <symbol id="i-move" viewBox="0 0 24 24"><path d="M3 6.5A2.5 2.5 0 0 1 5.5 4h3.6c.6 0 1.2.24 1.6.66L12 6h6.5A2.5 2.5 0 0 1 21 8.5v9a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5z" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8 13h7.5M13 10.5l2.5 2.5-2.5 2.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-photos" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 3.5v6.5M20.1 9.4l-6.2 2M17 19l-3.8-5.3M7 19l3.8-5.3M3.9 9.4l6.2 2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></symbol>
    </defs>
  </svg>

  <!-- Anmeldung -->
  <section id="login" class="login" hidden>
    <form id="login-form" class="login-card" autocomplete="on">
      <div class="brand brand-lg"><svg class="brand-mark"><use href="#i-cloud"/></svg><span>Pi Cloud</span></div>
      <label>Benutzer<input name="username" autocomplete="username" autocapitalize="off" required></label>
      <label>Passwort<input name="password" type="password" autocomplete="current-password" required></label>
      <p id="login-error" class="login-error" hidden></p>
      <button class="btn btn-primary" type="submit">Anmelden</button>
    </form>
  </section>

  <!-- Hauptansicht -->
  <div id="app" class="app" hidden>
    <header class="topbar">
      <div class="topbar-row">
        <a class="brand" href="#/files" aria-label="Startseite"><svg class="brand-mark"><use href="#i-cloud"/></svg><span>Pi Cloud</span></a>
        <nav class="tabs" id="tabs" aria-label="Bereich">
          <a href="#/files" data-tab="files"><svg class="ic"><use href="#i-folder"/></svg><span>Dateien</span></a>
          <a href="#/photos" data-tab="photos"><svg class="ic"><use href="#i-photos"/></svg><span>Fotos</span></a>
        </nav>
        <div class="search">
          <svg class="ic"><use href="#i-search"/></svg>
          <input id="search" type="search" placeholder="In diesem Ordner suchen" autocomplete="off" enterkeyhint="search">
        </div>
        <button class="icon-btn" id="btn-menu" aria-label="Menü"><svg class="ic"><use href="#i-more"/></svg></button>
      </div>
      <div class="toolbar">
        <nav id="crumbs" class="crumbs" aria-label="Pfad"></nav>
        <div class="toolbar-actions">
          <button class="icon-btn" id="btn-sort" aria-label="Sortieren"><svg class="ic"><use href="#i-sort"/></svg></button>
          <button class="icon-btn" id="btn-view" aria-label="Ansicht wechseln"><svg class="ic"><use href="#i-grid"/></svg></button>
          <button class="icon-btn" id="btn-select" aria-label="Auswählen" title="Auswählen"><svg class="ic"><use href="#i-select"/></svg></button>
          <button class="icon-btn" id="btn-album" aria-label="Album-Aktionen" title="Album-Aktionen" hidden><svg class="ic"><use href="#i-more"/></svg></button>
        </div>
      </div>
    </header>

    <div id="selbar" class="selbar" hidden>
      <button class="icon-btn" id="sel-cancel" aria-label="Auswahl beenden"><svg class="ic"><use href="#i-close"/></svg></button>
      <span id="sel-count" class="sel-count">0 ausgewählt</span>
      <button class="icon-btn" id="sel-all" aria-label="Alle auswählen" title="Alle auswählen"><svg class="ic"><use href="#i-select"/></svg></button>
      <button class="icon-btn" id="sel-album" aria-label="Zu Album hinzufügen" title="Zu Album hinzufügen" hidden><svg class="ic"><use href="#i-album-add"/></svg></button>
      <button class="icon-btn" id="sel-unalbum" aria-label="Aus Album entfernen" title="Aus Album entfernen" hidden><svg class="ic"><use href="#i-album-remove"/></svg></button>
      <button class="icon-btn" id="sel-move" aria-label="Verschieben" title="Verschieben" hidden><svg class="ic"><use href="#i-move"/></svg></button>
      <button class="icon-btn" id="sel-download" aria-label="Herunterladen" title="Herunterladen"><svg class="ic"><use href="#i-download"/></svg></button>
      <button class="icon-btn danger" id="sel-delete" aria-label="Löschen" title="Löschen"><svg class="ic"><use href="#i-trash"/></svg></button>
    </div>

    <main id="main" class="main">
      <div id="listing" class="listing"></div>
      <div id="empty" class="empty" hidden>
        <svg class="empty-ic"><use href="#i-folder"/></svg>
        <p class="empty-title">Dieser Ordner ist leer</p>
        <p class="empty-sub">Tippe auf <b>+</b> oder ziehe Dateien hierher.</p>
      </div>
      <div id="loading" class="loading" hidden><span class="spinner"></span></div>
    </main>

    <button class="fab" id="fab" aria-label="Neu"><svg class="ic"><use href="#i-plus"/></svg></button>
    <input id="file-input" type="file" multiple hidden>
  </div>

  <!-- Upload-Fortschritt -->
  <aside id="uploads" class="uploads" hidden>
    <div class="uploads-head">
      <span id="uploads-title">Hochladen</span>
      <button class="icon-btn sm" id="uploads-close" aria-label="Schließen"><svg class="ic"><use href="#i-close"/></svg></button>
    </div>
    <div class="uploads-bar"><span id="uploads-progress"></span></div>
    <ul id="uploads-list" class="uploads-list"></ul>
  </aside>

  <!-- Betrachter -->
  <div id="viewer" class="viewer" hidden>
    <header class="viewer-bar">
      <button class="icon-btn" id="v-close" aria-label="Schließen"><svg class="ic"><use href="#i-close"/></svg></button>
      <div class="viewer-title"><span id="v-name"></span><small id="v-meta"></small></div>
      <div class="viewer-tools" id="v-pdf-tools" hidden>
        <button class="icon-btn" id="v-zoom-out" aria-label="Verkleinern"><svg class="ic"><use href="#i-zoom-out"/></svg></button>
        <button class="icon-btn" id="v-zoom-in" aria-label="Vergrößern"><svg class="ic"><use href="#i-zoom-in"/></svg></button>
      </div>
      <a class="icon-btn" id="v-download" aria-label="Herunterladen" download><svg class="ic"><use href="#i-download"/></svg></a>
      <button class="icon-btn" id="v-more" aria-label="Weitere Aktionen"><svg class="ic"><use href="#i-more"/></svg></button>
    </header>
    <div id="v-stage" class="viewer-stage"></div>
    <button class="viewer-nav prev" id="v-prev" aria-label="Vorherige Datei"><svg class="ic"><use href="#i-left"/></svg></button>
    <button class="viewer-nav next" id="v-next" aria-label="Nächste Datei"><svg class="ic"><use href="#i-right"/></svg></button>
    <div id="v-page" class="viewer-page" hidden></div>
  </div>

  <!-- Menüs & Dialoge -->
  <div id="sheet" class="sheet" hidden>
    <div class="sheet-backdrop" data-close></div>
    <div class="sheet-panel" role="menu">
      <div id="sheet-title" class="sheet-title"></div>
      <div id="sheet-items"></div>
    </div>
  </div>

  <div id="picker" class="sheet" hidden>
    <div class="sheet-backdrop" data-close></div>
    <div class="sheet-panel picker-panel" role="dialog" aria-labelledby="picker-title">
      <div id="picker-title" class="sheet-title"></div>
      <div class="picker-head">
        <button class="icon-btn" id="picker-up" aria-label="Übergeordneter Ordner"><svg class="ic"><use href="#i-left"/></svg></button>
        <span id="picker-path" class="picker-path"></span>
        <button class="icon-btn" id="picker-new" aria-label="Neuer Ordner" title="Neuer Ordner"><svg class="ic"><use href="#i-folder-plus"/></svg></button>
      </div>
      <div id="picker-items" class="picker-items"></div>
      <div class="dialog-actions picker-actions">
        <button class="btn" data-close>Abbrechen</button>
        <button class="btn btn-primary" id="picker-ok">Hierher verschieben</button>
      </div>
    </div>
  </div>

  <dialog id="dialog" class="dialog">
    <form method="dialog" id="dialog-form">
      <h2 id="dialog-title"></h2>
      <p id="dialog-text"></p>
      <input id="dialog-input" autocomplete="off" autocapitalize="off" spellcheck="false">
      <div class="dialog-actions">
        <button class="btn" value="cancel" formnovalidate>Abbrechen</button>
        <button class="btn btn-primary" id="dialog-ok" value="ok">OK</button>
      </div>
    </form>
  </dialog>

  <div id="dropzone" class="dropzone" hidden><div><svg class="ic"><use href="#i-upload"/></svg><p>Zum Hochladen loslassen</p></div></div>
  <div id="toast" class="toast" role="status" hidden></div>

  <script src="/app.js" type="module"></script>
</body>
</html>
