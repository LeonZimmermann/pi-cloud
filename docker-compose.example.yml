# In deine bestehende docker-compose.yml unter "services:" einfügen.
# Der Ordner pi-cloud/ liegt dabei neben der docker-compose.yml.
services:
  pi-cloud:
    build: ./pi-cloud
    container_name: pi-cloud
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      # Eine Zeile pro Benutzer: name:passwort (Namen klein, a-z 0-9 . _ -)
      CLOUD_USERS: |
        leon:${PI_CLOUD_PW_LEON}
        anna:${PI_CLOUD_PW_ANNA}
      SHARED_NAME: Familie        # Anzeigename des gemeinsamen Bereichs
      PHOTOS_FOLDER: Bilder       # Fotoordner in jedem Bereich
      PUID: 1000                  # Ausgabe von: id -u
      PGID: 1000                  # Ausgabe von: id -g
      # THUMBNAILS: "off"         # Vorschaubilder abschalten
      # THUMB_CACHE: 1g           # max. Größe des Vorschaubild-Caches
    volumes:
      # Ein einziger Ordner für alles (wichtig, damit Verschieben zwischen
      # persönlich und Familie schnell geht). Darin entstehen:
      #   users/<name>/   persönliche Bereiche
      #   shared/         Familie
      - /mnt/daten/cloud:/data
      - pi-cloud-cache:/var/cache/nginx

volumes:
  pi-cloud-cache:
